name: Deploy

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: [ "Build and Test" ]
    branches: [ main ]
    types: [ completed ] 

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push image
        run: |
          docker build -f ./src/TaskManager/TaskManager.ApiGateway/Dockerfile -t krakv/task-manager:latest -t krakv/task-manager:${{ github.sha }} ./src/TaskManager
          docker push krakv/task-manager:latest
          docker push krakv/task-manager:${{ github.sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ${{ secrets.APP_PATH }}
            git pull
            docker compose -f ./docker/docker-compose.cd.yml up -d --build
